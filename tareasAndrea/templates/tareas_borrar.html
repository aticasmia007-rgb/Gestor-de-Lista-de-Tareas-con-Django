<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrar Tareas | Andrea</title>
</head>
<body>
    <h5> {{borrando_estadoTask.title}} </h5>
    <h2>Si quieres borrar la tarea pulse el botón rojo.</h2>
    <div id="formulario">
            <form method="post" action="">
                {% csrf_token %} <!-- Es una linea que se pone por seguridad, sino no podría ejecutar el post... -->
                <button style="background-color: brown" type="submit" name="borrar">Borrar Tarea</button>
            </form>


    <h2>Si quieres cambiar el estado de la tarea, pulse el botón grisaceo.</h2>
            <form method="post" action=""> <!--Falso patch-->
                {% csrf_token %}
                <button style="background-color: cadetblue" type="submit" name="cambiarEstado">Cambiar Estado</button>
            </form>
            
            
    </div>
</body>
</html>
